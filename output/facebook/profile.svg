<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"><rect width="1024" height="1024" fill="#081422"/><circle cx="512" cy="512" r="395" fill="#0b1c25" stroke="#174c47" stroke-width="3"/><svg x="250" y="250" width="524" height="524" viewBox="0 0 64 64">
