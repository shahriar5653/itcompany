  <!-- Letter S: Dynamic Overlapping Flow -->
  <path d="M41 22C41 22 46 22 47.5 24C49 26 47 28.5 44 29.5C41 30.5 39 33 40.5 35.5C42 38 46 38 48 37" stroke="url(#rs-accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
