<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | RSTechwerk</title><link rel="stylesheet" href="/styles.css"><style>body{background:#f8fafc;color:#0f172a}.reset-shell{min-height:100vh;display:grid;place-items:center;padding:2rem}.reset-card{width:min(520px,100%);background:#fff;border:1px solid #dbe4ee;border-radius:1.5rem;padding:2.5rem;box-shadow:0 20px 60px #0f172a12}.reset-form{display:grid;gap:1rem}.reset-form input{padding:.9rem;border:1px solid #dbe4ee;border-radius:.75rem;font:inherit}.reset-message{color:#b91c1c}</style></head><body><main class="reset-shell"><section class="reset-card"><a href="/login.html">← Back to sign in</a><span class="section-kicker" style="display:block;margin-top:2rem">ACCOUNT SECURITY</span><h1>Set a new password.</h1><p>Choose a strong password with at least 10 characters.</p><form id="resetForm" class="reset-form"><input name="password" type="password" minlength="10" required placeholder="New password"><input name="confirmPassword" type="password" minlength="10" required placeholder="Confirm new password"><button class="btn btn-primary" type="submit">Reset password</button><p id="resetMessage" class="reset-message"></p></form></section></main><script src="/reset-password.js"></script></body></html>
