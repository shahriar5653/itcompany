<!doctype html><html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Client Profile | RSTechwerk Admin</title><link rel="stylesheet" href="/admin.css"><style>.client-edit-shell{max-width:1000px;margin:0 auto;padding:3rem 1.5rem}.client-edit-header{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;margin-bottom:2rem}.client-edit-card{background:var(--admin-surface,#111827);border:1px solid rgba(148,163,184,.25);border-radius:22px;padding:2rem;box-shadow:0 18px 45px #0005}.client-edit-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.25rem}.client-edit-form .full{grid-column:1/-1}.client-edit-form label{display:grid;gap:.45rem;color:#94a3b8}.client-edit-form input,.client-edit-form select{width:100%;box-sizing:border-box}.client-detail-strip{display:flex;gap:1rem;flex-wrap:wrap;margin:1rem 0 2rem}.client-detail-strip span{padding:.65rem .85rem;border-radius:10px;background:rgba(16,185,129,.1);color:#34d399}@media(max-width:700px){.client-edit-header{flex-direction:column}.client-edit-form{grid-template-columns:1fr}.client-edit-form .full{grid-column:auto}}</style></head><body><main class="client-edit-shell"><div class="client-edit-header"><div><a href="/admin.html">← Back to admin</a><p class="section-kicker" style="margin-top:2rem">USER MANAGEMENT</p><h1 class="panel-title">Edit client profile</h1><p class="panel-subtitle">Update account details and portal access settings.</p></div><button class="btn btn-secondary" id="clientEditLogout">Sign out</button></div><section id="clientEditContent"><div class="client-edit-card">Loading client profile…</div></section></main><script src="/admin-client.js"></script></body></html>
