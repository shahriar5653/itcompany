<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Client Workspace | RSTechwerk</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Portal Stylesheet -->
    <link rel="stylesheet" href="/portal.css" />
  </head>
  <body>
    <div class="portal-app">
      <!-- Mobile Drawer Backdrop -->
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

      <!-- Left Navigation Sidebar -->
      <aside class="portal-sidebar" id="portalSidebar" aria-label="Client workspace navigation">
        <div class="portal-sidebar-header">
          <a class="portal-brand" href="/" aria-label="RSTechwerk Home">
            <svg class="portal-brand-emblem" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <defs>
                <linearGradient id="portal-rs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#0b1320" />
                  <stop offset="100%" stop-color="#041f17" />
                </linearGradient>
                <linearGradient id="portal-rs-glow" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#10b981" />
                  <stop offset="50%" stop-color="#06b6d4" />
                  <stop offset="100%" stop-color="#3b82f6" />
                </linearGradient>
                <linearGradient id="portal-rs-accent" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#34d399" />
                  <stop offset="100%" stop-color="#38bdf8" />
                </linearGradient>
              </defs>
              <rect x="1" y="1" width="34" height="34" rx="9" fill="url(#portal-rs-bg)" stroke="url(#portal-rs-glow)" stroke-width="1.5" />
              <circle cx="28" cy="8" r="1.75" fill="#38bdf8" />
              <path d="M26 8H22" stroke="#38bdf8" stroke-width="1.25" stroke-linecap="round" />
              <path d="M9 26V10H16C18.4853 10 20.5 12.0147 20.5 14.5C20.5 16.9853 18.4853 19 16 19H9M14.5 19L21 26" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M23 13C23 13 26 13 27 14.2C28 15.4 26.8 17 24.8 17.6C22.8 18.2 21.8 19.8 22.8 21.2C23.8 22.6 26.5 22.5 27.5 22" stroke="url(#portal-rs-accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span class="portal-brand-text">
              <span class="portal-brand-rs">RS</span><span class="portal-brand-tech">Techwerk</span>
            </span>
          </a>
          <button
            type="button"
            class="portal-sidebar-close"
            id="sidebarCloseBtn"
            aria-label="Close navigation menu"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <nav class="portal-sidebar-nav" id="portalSidebarNav">
          <div>
            <div class="portal-nav-group-label">Workspace</div>
            <div class="portal-nav-list">
              <button type="button" class="portal-nav-btn active" data-portal-nav="overview">
                <span class="portal-nav-btn-left">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="3" width="7" height="9" rx="1"></rect>
                    <rect x="14" y="3" width="7" height="5" rx="1"></rect>
                    <rect x="14" y="12" width="7" height="9" rx="1"></rect>
                    <rect x="3" y="16" width="7" height="5" rx="1"></rect>
                  </svg>
                  <span>Overview</span>
                </span>
              </button>

              <button type="button" class="portal-nav-btn" data-portal-nav="projects">
                <span class="portal-nav-btn-left">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                  </svg>
                  <span>Projects &amp; Milestones</span>
                </span>
                <span class="portal-nav-count" id="navCountProjects"></span>
              </button>

              <button type="button" class="portal-nav-btn" data-portal-nav="offers">
                <span class="portal-nav-btn-left">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                  </svg>
                  <span>Quotes &amp; Offers</span>
                </span>
                <span class="portal-nav-count" id="navCountOffers"></span>
              </button>

              <button type="button" class="portal-nav-btn" data-portal-nav="maintenance">
                <span class="portal-nav-btn-left">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
                  </svg>
                  <span>Maintenance</span>
                </span>
                <span class="portal-nav-count" id="navCountMaintenance"></span>
              </button>

              <button type="button" class="portal-nav-btn" data-portal-nav="billing">
                <span class="portal-nav-btn-left">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                    <line x1="1" y1="10" x2="23" y2="10"></line>
                  </svg>
                  <span>Billing &amp; Invoices</span>
                </span>
                <span class="portal-nav-count" id="navCountBilling"></span>
              </button>
            </div>
          </div>

          <div>
            <div class="portal-nav-group-label">Delivery &amp; Files</div>
            <div class="portal-nav-list">
              <button type="button" class="portal-nav-btn" data-portal-nav="updates">
                <span class="portal-nav-btn-left">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                  </svg>
                  <span>Delivery Updates</span>
                </span>
              </button>

              <button type="button" class="portal-nav-btn" data-portal-nav="documents">
                <span class="portal-nav-btn-left">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                  </svg>
                  <span>Documents</span>
                </span>
                <span class="portal-nav-count" id="navCountDocuments"></span>
              </button>
            </div>
          </div>

          <div>
            <div class="portal-nav-group-label">Account</div>
            <div class="portal-nav-list">
              <button type="button" class="portal-nav-btn" data-portal-nav="profile">
                <span class="portal-nav-btn-left">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                  <span>Profile &amp; Security</span>
                </span>
              </button>
            </div>
          </div>
        </nav>

        <div class="portal-sidebar-footer">
          <div class="portal-account-summary" id="sidebarAccountCard" style="display: none;">
            <div class="portal-avatar" id="sidebarAvatar">CL</div>
            <div class="portal-account-meta">
              <div class="portal-account-name" id="sidebarContactName">Client Account</div>
              <div class="portal-account-company" id="sidebarCompanyName">Loading…</div>
            </div>
          </div>

          <div class="portal-footer-actions">
            <a href="/" class="portal-footer-link">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                <polyline points="15 3 21 3 21 9"></polyline>
                <line x1="10" y1="14" x2="21" y2="3"></line>
              </svg>
              <span>Back to Website</span>
            </a>
            <button type="button" class="portal-footer-link danger" id="portalLogout">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
              </svg>
              <span>Sign Out</span>
            </button>
          </div>
        </div>
      </aside>

      <!-- Main Workspace Column -->
      <div class="portal-main-column">
        <header class="portal-topbar">
          <div class="portal-topbar-left">
            <button
              type="button"
              class="portal-menu-toggle"
              id="mobileMenuBtn"
              aria-label="Open navigation menu"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
              </svg>
            </button>
            <div class="portal-breadcrumb">
              <span class="portal-breadcrumb-root">Client Portal</span>
              <span class="portal-breadcrumb-sep" aria-hidden="true">/</span>
              <span class="portal-breadcrumb-current" id="topbarBreadcrumbTitle">Overview</span>
            </div>
          </div>

          <div class="portal-topbar-right">
            <button
              type="button"
              class="portal-icon-btn"
              id="portalThemeToggle"
              title="Toggle Light / Dark theme"
              aria-label="Toggle theme"
            >
              <span id="portalThemeIcon">☾</span>
            </button>
            <a href="/#contact" class="btn btn-secondary btn-sm">Contact Team</a>
            <button type="button" class="btn btn-primary btn-sm" id="topbarProfileBtn">My Profile</button>
          </div>
        </header>

        <main class="portal-workspace-body">
          <div id="portalPaymentBanner"></div>
          <section id="portalContent" aria-live="polite">
            <div class="view-header">
              <div>
                <div class="skeleton-block" style="width: 240px; height: 30px; margin-bottom: 10px;"></div>
                <div class="skeleton-block" style="width: 360px; height: 18px;"></div>
              </div>
            </div>
            <div class="kpi-strip">
              <div class="kpi-cell"><div class="skeleton-block" style="width: 90px; height: 14px;"></div><div class="skeleton-block" style="width: 60px; height: 28px; margin-top: 6px;"></div></div>
              <div class="kpi-cell"><div class="skeleton-block" style="width: 90px; height: 14px;"></div><div class="skeleton-block" style="width: 60px; height: 28px; margin-top: 6px;"></div></div>
              <div class="kpi-cell"><div class="skeleton-block" style="width: 90px; height: 14px;"></div><div class="skeleton-block" style="width: 60px; height: 28px; margin-top: 6px;"></div></div>
              <div class="kpi-cell"><div class="skeleton-block" style="width: 90px; height: 14px;"></div><div class="skeleton-block" style="width: 60px; height: 28px; margin-top: 6px;"></div></div>
            </div>
            <div class="surface-card surface-card-pad">
              <div class="skeleton-block" style="width: 100%; height: 180px;"></div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="/portal.js"></script>
  </body>
</html>
