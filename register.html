<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Client Portal Account | RSTechwerk</title><link rel="stylesheet" href="/styles.css"><style>body{background:#f8fafc;color:#0f172a}.register-shell{min-height:100vh;display:grid;place-items:center;padding:2rem}.register-card{width:min(620px,100%);background:#fff;border:1px solid #dbe4ee;border-radius:1.5rem;padding:clamp(1.5rem,5vw,3rem);box-shadow:0 20px 60px #0f172a12}.register-card h1{font-size:clamp(2rem,5vw,3.5rem);margin:.5rem 0}.register-form{display:grid;gap:1rem}.register-form label{display:grid;gap:.4rem;color:#475569}.register-form input,.register-form select{padding:.9rem;border:1px solid #dbe4ee;border-radius:.75rem;font:inherit}.register-actions{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}.register-message{color:#b91c1c}</style></head><body><main class="register-shell"><section class="register-card"><a href="/">← RSTechwerk</a><span class="section-kicker" style="display:block;margin-top:2rem">CLIENT PORTAL</span><h1>Start your client workspace.</h1><p class="portal-muted">Create one secure account to review proposals, projects, milestones, invoices, updates, and shared files.</p><form id="registerForm" class="register-form"><label>Company name *<input name="companyName" required autocomplete="organization"></label><label>Contact name *<input name="contactName" required autocomplete="name"></label><label>Work email *<input name="email" type="email" required autocomplete="email"></label><label>Phone<input name="phone" type="tel" autocomplete="tel"></label><label>Country<select name="country"><option value="Germany">Germany</option><option value="Bangladesh">Bangladesh</option><option value="United Kingdom">United Kingdom</option><option value="United States">United States</option><option value="Other">Other</option></select></label><label>Password *<input name="password" type="password" minlength="10" required autocomplete="new-password"></label><label>Confirm password *<input name="confirmPassword" type="password" minlength="10" required autocomplete="new-password"></label><label style="display:flex;gap:.6rem;align-items:flex-start"><input name="terms" type="checkbox" required style="width:auto;margin-top:.3rem">I agree to use this portal for project communication and delivery.</label><div class="register-actions"><button class="btn btn-primary" type="submit">Create account</button><a href="/login.html">Already have an account?</a></div><p id="registerMessage" class="register-message" role="alert"></p></form></section></main><script src="/register.js"></script></body></html>
